<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>静态资源下载器</title>
  </head>
  <body>
    <div class="app">
      <section class="left-pane">
        <section class="card">
          <label>
            网站 URL
            <input
              type="url"
              id="url"
              placeholder="https://example.com"
              autocomplete="on"
            />
          </label>
          <label>
            保存目录
            <div class="row">
              <input type="text" id="outDir" readonly placeholder="未选择" />
              <button type="button" id="pick">选择目录</button>
            </div>
          </label>
          <label>
            上传服务器地址
            <input type="url" id="uploadServerUrl" placeholder="http://127.0.0.1:3201" autocomplete="on" />
          </label>
          <div class="actions">
            <button type="button" id="start">开始采集</button>
            <button type="button" id="stop" class="secondary" disabled>
              停止采集
            </button>
            <button type="button" id="preprocess" class="tertiary" disabled>
              预处理
            </button>
            <button type="button" id="uploadZip" class="tertiary" disabled>
              打包并上传
            </button>
          </div>
        </section>
      </section>

      <section class="right-pane">
        <section class="log-section">
          <div class="log-header">
            <h2>日志</h2>
            <button type="button" id="clearLog" class="ghost">清空</button>
          </div>
          <pre id="log" class="log" aria-live="polite"></pre>
        </section>
      </section>
    </div>
    
    <div
      id="settingsModal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >
      <div class="modal-backdrop" data-close-modal="true"></div>
      <section class="modal-panel">
        <div class="modal-header">
          <h3 id="settingsTitle">编辑 settings.json</h3>
        </div>
        <p class="modal-subtitle">修改标题并选择一张缩略图作为封面。</p>
        <label class="modal-field">
          标题
          <input id="settingsTitleInput" type="text" autocomplete="off" />
        </label>
        <div class="modal-field">
          <label for="settingsTagInput">标签</label>
          <div class="tag-input-row">
            <input id="settingsTagInput" type="text" autocomplete="off" placeholder="输入标签后点击添加" />
            <button type="button" id="settingsAddTag" class="tertiary">添加标签</button>
          </div>
          <div id="settingsTagList" class="tag-list"></div>
        </div>
        <div class="modal-field">
          <label>封面</label>
        </div>
        <div id="coverGrid" class="cover-grid"></div>
        <div class="modal-actions">
          <button type="button" id="settingsCancel" class="tertiary">
            取消
          </button>
          <button type="button" id="settingsSave">保存设置</button>
        </div>
      </section>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
